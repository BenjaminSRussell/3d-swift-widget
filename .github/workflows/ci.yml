name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_15.4.app ]; then
            sudo xcode-select -switch /Applications/Xcode_15.4.app
          elif [ -d /Applications/Xcode.app ]; then
            sudo xcode-select -switch /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Compile Metal shaders
        run: |
          chmod +x compile_shaders.sh
          ./compile_shaders.sh

      - name: SwiftLint
        run: |
          if command -v swiftlint >/dev/null 2>&1; then
            swiftlint --strict || swiftlint lint --reporter github-actions-logging
          else
            brew install swiftlint
            swiftlint lint --reporter github-actions-logging || true
          fi
        continue-on-error: true

      - name: Build
        run: swift build -v

      - name: Test
        run: swift test -v --parallel
